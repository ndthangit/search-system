services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    networks:
      - search-system
    environment:
      # Basic configuration
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      # - cluster.initial_master_nodes=es01

      # Memory optimization
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - indices.memory.index_buffer_size=10%

      # Security
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false

      # Index settings for optimal performance with 20GB data
      - indices.id_field_data.enabled=false
      - indices.queries.cache.size=5%
      - indices.fielddata.cache.size=5%
      - indices.memory.index_buffer_size=5%
      - indices.recovery.max_bytes_per_sec=50mb
      - cluster.routing.allocation.node_concurrent_recoveries=2
      - node.store.allow_mmap=false

      # Search and memory settings
      - search.default_search_timeout=30s
      - thread_pool.write.queue_size=200
      - thread_pool.search.queue_size=200

      # Circuit breakers for memory protection
      - indices.breaker.total.limit=60%
      - indices.breaker.fielddata.limit=30%
      - indices.breaker.request.limit=40%
      - indices.fielddata.cache.size=15%
      - indices.queries.cache.size=10%

      # Disk settings
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=85%
      - cluster.routing.allocation.disk.watermark.high=90%
      - cluster.routing.allocation.disk.watermark.flood_stage=95%
    mem_limit: 3g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'You Know, for Search'" ]
      interval: 10s
      timeout: 10s
      retries: 120

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: search-backend
    networks:
      - search-system
    ports:
      - 8080:8080
    environment:
      - ELASTICSEARCH_HOST=http://es01:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    depends_on:
      search_db:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: search-frontend
    networks:
      - search-system
    ports:
      - 5173:5173
    depends_on:
      - backend
    restart: unless-stopped

  search_db:
    build:
      context: ./search-db
      dockerfile: Dockerfile
    container_name: search-db
    networks:
      - search-system
    environment:
      - ELASTICSEARCH_HOST=http://es01:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    depends_on:
      es01:
        condition: service_healthy
    restart: no

networks:
  search-system:
    driver: bridge

volumes:
  esdata01: