services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    networks:
      - search-system
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 \{\} \;;
        find . -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        
        # Configure optimal settings for 20GB data with 8GB RAM
        echo "Configuring optimal settings for 20GB data with 8GB RAM";
        
        # Cluster settings
        until curl -s -X PUT --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_cluster/settings -d "{
          \"persistent\": {
            \"indices.query.bool.max_clause_count\": 16384,
            \"cluster.routing.allocation.disk.threshold_enabled\": true,
            \"cluster.routing.allocation.disk.watermark.low\": \"85%\",
            \"cluster.routing.allocation.disk.watermark.high\": \"90%\",
            \"cluster.routing.allocation.disk.watermark.flood_stage\": \"95%\",
            \"indices.breaker.total.limit\": \"60%\",
            \"indices.breaker.fielddata.limit\": \"30%\",
            \"indices.breaker.request.limit\": \"40%\",
            \"indices.fielddata.cache.size\": \"15%\",
            \"indices.queries.cache.size\": \"10%\"
          },
          \"transient\": {
            \"logger.org.elasticsearch.indices.breaker\": \"INFO\"
          }
        }" > /dev/null; do sleep 5; done;
        
        echo "All done!";
      '
    healthcheck:
      test: [ "CMD-SHELL", "[ -f config/certs/es01/es01.crt ]" ]
      interval: 1s
      timeout: 5s
      retries: 120

  es01:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    networks:
      - search-system
    environment:
      # Basic configuration
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      # - cluster.initial_master_nodes=es01

      # Security
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate

      # Memory optimization
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - indices.memory.index_buffer_size=10%

      # License
      - xpack.license.self_generated.type=${LICENSE}

      # Index settings for optimal performance with 20GB data
      - indices.id_field_data.enabled=false
      - indices.queries.cache.size=5%
      - indices.fielddata.cache.size=5%
      - indices.memory.index_buffer_size=5%
      - indices.recovery.max_bytes_per_sec=50mb
      - cluster.routing.allocation.node_concurrent_recoveries=2
      - node.store.allow_mmap=false

      # Search and memory settings
      - search.default_search_timeout=30s
      - thread_pool.write.queue_size=200
      - thread_pool.search.queue_size=200

      # Circuit breakers for memory protection
      - indices.breaker.total.limit=60%
      - indices.breaker.fielddata.limit=30%
      - indices.breaker.request.limit=40%
      - indices.fielddata.cache.size=15%
      - indices.queries.cache.size=10%

      # Disk settings
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=85%
      - cluster.routing.allocation.disk.watermark.high=90%
      - cluster.routing.allocation.disk.watermark.flood_stage=95%

    mem_limit: 3g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'" ]
      interval: 10s
      timeout: 10s
      retries: 120

