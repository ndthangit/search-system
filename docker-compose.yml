  #   mem_limit: 1g
  #   healthcheck:
  #     test: [ "CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'" ]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 120

  semantic:
    # build:
    #   context: ./semantic
    #   dockerfile: Dockerfile
    image: thangit67/semanticsearch:1.4.0
    ports:
      - 8001:8001
    volumes:
      - certs:/usr/share/semantic/config/certs
      - semanticdata:/usr/share/semantic/data
    depends_on:
      es01:
        condition: service_healthy
    networks:
      - search-system  # Thêm vào cùng network

    environment:
      - ELASTIC_URL=https://es01:9200
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=elastic
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/semantic/config/certs/ca/ca.crt

networks:
  search-system:
    driver: bridge

volumes:
  certs:
    driver: local
  esdata01:
    driver: local
  kibanadata:
    driver: local
  semanticdata:
    driver: local
